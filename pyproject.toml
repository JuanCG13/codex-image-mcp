[project]
name = "codex-image-mcp"
version = "0.1.0"
description = "MCP server that generates images (sprites, concept art) with your ChatGPT plan through the official Codex CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "numpy>=1.24", "pillow>=10"]
keywords = ["mcp", "codex", "chatgpt", "image-generation", "sprites", "gamedev"]

[project.scripts]
codex-image-mcp = "codex_image_mcp.server:main"

[project.urls]
Repository = "https://github.com/JuanCG13/codex-image-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_image_mcp"]
